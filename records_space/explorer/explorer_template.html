<title>Records Space Explorer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: control rail | square map stage | record card. Rail and card stack under the map on narrow screens. */
:root{
  --bg:#F3F6F9; --panel:#FFFFFF; --ink:#17212B; --mute:#5A6877; --line:#D9E1E8; --accent:#146DB5; --accent-ink:#FFFFFF;
  --chip:#E8EEF3; --neutral:#D3D9DF; --neutral2:#A9B1B9; --missing:#2B2D42; --canvas:#FFFFFF; --mid:#F1F4F7;
  --font-ui:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1217; --panel:#151C24; --ink:#E6ECF2; --mute:#93A1B0; --line:#26313C; --accent:#4DB4F2; --accent-ink:#08131C;
    --chip:#1C2530; --neutral:#3A4652; --neutral2:#6B7A89; --missing:#E8ECF1; --canvas:#10161D; --mid:#222C37; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1217; --panel:#151C24; --ink:#E6ECF2; --mute:#93A1B0; --line:#26313C; --accent:#4DB4F2; --accent-ink:#08131C;
  --chip:#1C2530; --neutral:#3A4652; --neutral2:#6B7A89; --missing:#E8ECF1; --canvas:#10161D; --mid:#222C37; color-scheme:dark;
}
body{ background:var(--bg); color:var(--ink); font-family:var(--font-ui); line-height:1.45; }
.app{ max-width:1500px; margin-inline:auto; padding-block:16px 28px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }
.top{ display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 18px; margin-bottom:14px; }
h1{ margin:0; font-size:1.35rem; font-weight:600; letter-spacing:-0.01em; }
.sub{ margin:0; color:var(--mute); font-size:0.86rem; min-width:0; }
.layout{ display:grid; gap:14px; grid-template-columns:minmax(0,1fr); grid-template-areas:"stage" "card" "rail"; align-items:start; }
.stage{ grid-area:stage; } .card{ grid-area:card; } .rail{ grid-area:rail; }
@media (min-width:760px){ .layout{ grid-template-columns:220px minmax(0,1fr); grid-template-areas:"rail stage" "card card"; } }
@media (min-width:960px){ .layout{ grid-template-columns:220px minmax(0,1fr) 280px; grid-template-areas:"rail stage card"; } .card{ position:sticky; top:12px; max-height:calc(100vh - 24px); overflow:auto; } }
.toolbar{ display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:10px; }
.rail, .card{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; min-width:0; }
.rail{ display:flex; flex-direction:column; gap:12px; }
.grp{ display:flex; flex-direction:column; gap:5px; min-width:0; }
.grp > label, .lab{ font-size:0.7rem; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:var(--mute); }
select, input[type=search], input[type=number]{ font:inherit; font-size:0.85rem; color:var(--ink); background:var(--mid); border:1px solid var(--line); border-radius:6px; padding:6px 8px; min-width:0; width:100%; }
select:focus-visible, input:focus-visible, button:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
.chk{ display:flex; gap:8px; align-items:center; font-size:0.85rem; }
.range{ display:flex; align-items:center; gap:6px; color:var(--mute); }
button{ font:inherit; font-size:0.82rem; color:var(--ink); background:var(--chip); border:1px solid var(--line); border-radius:6px; padding:6px 10px; cursor:pointer; }
button:hover{ border-color:var(--accent); }
button.primary{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
.hint{ margin:0; color:var(--mute); font-size:0.76rem; }
.stage{ min-width:0; display:flex; flex-direction:column; gap:10px; }
.canvas-wrap{ position:relative; width:min(100%, 82vh); aspect-ratio:1 / 1; margin-inline:auto; background:var(--canvas); border:1px solid var(--line); border-radius:10px; overflow:hidden; touch-action:none; }
canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; cursor:crosshair; }
.zoom{ position:absolute; right:8px; top:8px; display:flex; gap:4px; }
.zoom button{ padding:3px 9px; background:var(--panel); }
.count{ position:absolute; left:10px; bottom:8px; font-family:var(--font-data); font-size:0.72rem; color:var(--mute); pointer-events:none; }
.legend{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; min-width:0; }
.legend h2, .card h2{ margin:0 0 8px; font-size:0.72rem; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:var(--mute); }
.lg-items{ display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:3px 14px; }
.lg{ display:flex; align-items:center; gap:8px; text-align:left; background:none; border:0; padding:3px 4px; border-radius:5px; font-size:0.8rem; min-width:0; }
.lg i{ width:11px; height:11px; border-radius:50%; flex:none; }
.lg span{ flex:1; min-width:0; overflow-wrap:anywhere; }
.lg b{ font-family:var(--font-data); font-weight:400; color:var(--mute); font-size:0.74rem; }
.lg.off{ opacity:0.35; }
.bar{ display:flex; flex-direction:column; gap:4px; max-width:420px; }
.bar canvas{ position:static; height:12px; width:100%; border-radius:3px; cursor:default; }
.bar .ticks{ display:flex; justify-content:space-between; font-family:var(--font-data); font-size:0.72rem; color:var(--mute); }
.chips{ display:flex; flex-wrap:wrap; gap:4px 14px; margin-top:8px; }
.card h3{ margin:0; font-size:1.02rem; font-weight:600; overflow-wrap:anywhere; }
.card .muted{ color:var(--mute); font-size:0.8rem; overflow-wrap:anywhere; }
.kv{ display:grid; grid-template-columns:auto 1fr; gap:4px 12px; margin:10px 0 0; font-size:0.82rem; }
.kv dt{ color:var(--mute); }
.kv dd{ margin:0; font-family:var(--font-data); font-size:0.78rem; overflow-wrap:anywhere; min-width:0; }
.acts{ display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
.tag{ display:inline-block; font-size:0.72rem; padding:1px 7px; border-radius:99px; background:var(--chip); border:1px solid var(--line); margin-right:4px; }
.stats{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:6px 0 12px; }
.stat{ background:var(--mid); border-radius:8px; padding:8px 10px; }
.stat b{ display:block; font-family:var(--font-data); font-size:1.15rem; font-weight:500; }
.stat span{ font-size:0.72rem; color:var(--mute); }
.card ul{ margin:8px 0 0; padding-left:1.1em; font-size:0.8rem; color:var(--mute); }
.card li{ margin:3px 0; }
/* ---- Try your own experiment ---- */
[hidden]{ display:none !important; }
.count{ max-width:calc(100% - 20px); }
.modes{ display:flex; gap:4px; margin-left:auto; }
.theme{ padding:5px 11px; border-radius:99px; font-size:0.95rem; line-height:1; }
.home{ font-size:0.82rem; color:var(--mute); text-decoration:none; white-space:nowrap; }
.home:hover{ color:var(--accent); }
.mode{ padding:5px 14px; border-radius:99px; }
.mode.on{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
.try{ grid-area:rail; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; min-width:0; font-size:0.85rem; }
.layout.try-mode{ grid-template-areas:"rail" "stage" "card"; }
@media (min-width:760px){ .layout.try-mode{ grid-template-columns:minmax(300px,350px) minmax(0,1fr); grid-template-areas:"rail stage" "card card"; } }
@media (min-width:1240px){ .layout.try-mode{ grid-template-columns:minmax(320px,350px) minmax(0,1fr) 320px; grid-template-areas:"rail stage card"; } }
.try h4{ margin:0; font-size:0.7rem; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:var(--mute); }
.tsec{ display:flex; flex-direction:column; gap:9px; min-width:0; }
.tsec + .tsec{ margin-top:14px; padding-top:14px; border-top:1px solid var(--line); }
.try textarea, .try input[type=text]{ font:inherit; font-size:0.84rem; color:var(--ink); background:var(--mid); border:1px solid var(--line); border-radius:6px; padding:6px 8px; width:100%; min-width:0; box-sizing:border-box; }
.try textarea{ resize:vertical; }
.try input:disabled{ opacity:0.45; }
.try .muted{ margin:0; color:var(--mute); font-size:0.78rem; overflow-wrap:anywhere; }
.try .chk{ align-items:flex-start; font-size:0.8rem; }
.try .chk input{ margin-top:2px; flex:none; }
.seqinfo{ display:flex; flex-direction:column; gap:3px; }
.fld{ display:flex; flex-direction:column; gap:3px; min-width:0; }
.fld > label{ font-size:0.72rem; font-weight:500; color:var(--mute); }
.fg2{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px 10px; }
.fg3{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:9px 10px; }
.inl{ display:flex; gap:6px; align-items:center; }
.inl input{ flex:1; min-width:0; }
.found{ display:flex; flex-wrap:wrap; gap:4px; }
.fchip{ font-size:0.72rem; padding:1px 7px; border-radius:99px; background:var(--chip); border:1px solid var(--line); overflow-wrap:anywhere; }
.readbox{ display:flex; flex-direction:column; gap:4px; }
.chips2{ display:flex; flex-wrap:wrap; gap:4px; align-items:center; margin-top:6px; }
.chip{ font-size:0.72rem; padding:3px 9px; border-radius:99px; }
.chip.on{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
details.more{ font-size:0.8rem; }
details.more > summary{ cursor:pointer; color:var(--mute); font-size:0.78rem; }
details.more > :not(summary){ margin-top:8px; }
details.more ul{ margin:8px 0 0; padding-left:1.1em; color:var(--mute); }
.tres{ display:flex; flex-direction:column; gap:10px; }
.tres h2{ margin:0; }
.verdict{ padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:var(--mid); font-size:0.8rem; border-left-width:4px; }
.verdict.good{ border-left-color:#35A45B; } .verdict.moderate{ border-left-color:#E7AC24; } .verdict.poor{ border-left-color:#E45A62; }
.nlist{ display:flex; flex-direction:column; gap:4px; }
.nbr{ display:flex; flex-direction:column; align-items:stretch; gap:1px; text-align:left; padding:6px 8px; border-radius:8px; background:var(--mid); border:1px solid transparent; }
.nbr:hover{ border-color:var(--accent); }
.nbr .l1{ display:flex; align-items:center; gap:7px; min-width:0; }
.nbr .l1 b{ font-family:var(--font-data); font-weight:500; color:var(--mute); font-size:0.74rem; width:1.2em; flex:none; }
.nbr .nm{ flex:1; min-width:0; font-weight:500; font-size:0.82rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.nbr .l2{ font-family:var(--font-data); font-size:0.7rem; color:var(--mute); overflow-wrap:anywhere; padding-left:calc(1.2em + 7px); }
.pill{ font-size:0.66rem; font-weight:600; padding:1px 7px; border-radius:99px; color:#fff; flex:none; }
.pill.ps{ background:#6B2A6B; } .pill.nps{ background:#008DB8; } .pill.csat{ background:#E7AC24; color:#17212B; } .pill.oth{ background:#6B7A89; }
.sbar{ display:flex; height:10px; border-radius:99px; overflow:hidden; background:var(--chip); }
.sbar i{ display:block; min-width:4px; } .sbar .ps{ background:#6B2A6B; } .sbar .nps{ background:#008DB8; } .sbar .oth{ background:#A9B1B9; }
.warn{ margin:0; background:var(--mid); border-left:4px solid #E7AC24; padding:6px 8px; border-radius:6px; font-size:0.78rem; }
.hlnote{ display:flex; flex-wrap:wrap; align-items:center; gap:4px 10px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px 12px; font-size:0.8rem; }
.hlnote.light{ border-style:dashed; }
.hlnote i{ width:12px; height:12px; border-radius:50%; flex:none; }
.hlnote p{ flex-basis:100%; margin:0; color:var(--mute); font-size:0.76rem; }
.badge{ font-size:0.68rem; padding:1px 8px; border-radius:99px; border:1px dashed var(--neutral2); color:var(--mute); }
.tsec .sidenote{ float:right; font-size:0.68rem; font-weight:400; letter-spacing:0; text-transform:none; color:var(--mute); font-style:italic; }
.tsec.hl{ border-left:4px solid var(--hl); padding-left:10px; }
.tsec.hl.light{ border-left-color:color-mix(in srgb, var(--hl) 35%, transparent); background:color-mix(in srgb, var(--hl) 6%, transparent); }
.tsec.nocond{ border-left:4px dashed var(--line); padding-left:10px; }
.tsec.nocond .fld, .tsec.nocond .readbox, .tsec.nocond textarea{ opacity:0.6; }
.tsec.nocond:focus-within .fld, .tsec.nocond:focus-within textarea{ opacity:1; }
.entryrow{ display:flex; flex-direction:column; gap:6px; }
.entryinfo{ font-size:0.78rem; color:var(--mute); padding:6px 8px; border-left:4px solid var(--hl, var(--line)); background:var(--mid); border-radius:6px; }
.glyphkey{ display:flex; flex-wrap:wrap; gap:4px 18px; padding:2px 6px; font-size:0.76rem; color:var(--mute); }
.glyphkey span{ display:inline-flex; align-items:center; gap:6px; }
.glyphkey i{ width:11px; height:11px; border-radius:50%; box-sizing:border-box; flex:none; }
.g-fill{ background:var(--accent); border:1px solid var(--canvas); } .g-ring{ border:1.5px solid var(--neutral2); }
.hlnote button{ font-size:0.74rem; padding:2px 9px; }
</style>

<div class="app">
  <header class="top">
    <a class="home" id="homeLink" href="../" hidden>&larr; OpenPhase</a>
    <h1>Records space</h1>
    <p class="sub" id="sub"></p>
    <div class="modes" role="group" aria-label="Mode">
      <button id="modeExplore" class="mode on" type="button" aria-pressed="true">Explore</button>
      <button id="modeTry" class="mode" type="button" aria-pressed="false">Try your own experiment</button>
    </div>
    <button id="themeBtn" class="theme" type="button" aria-label="Switch light or dark mode">&#9790;</button>
  </header>
  <script>
  (function () {
    var root = document.documentElement, KEY = "openphase-theme", btn = document.getElementById("themeBtn"), home = document.getElementById("homeLink");
    var sys = function () { return window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; };
    var saved = null; try { saved = localStorage.getItem(KEY); } catch (e) {}
    function show(t) { if (btn) { btn.textContent = t === "dark" ? "\u2600" : "\u263E"; btn.title = t === "dark" ? "Switch to light mode" : "Switch to dark mode"; btn.setAttribute("aria-label", btn.title); } }
    var cur = (saved === "light" || saved === "dark") ? saved : (root.getAttribute("data-theme") || sys());
    root.setAttribute("data-theme", cur); show(cur);
    if (btn) btn.addEventListener("click", function () { var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark"; root.setAttribute("data-theme", next); show(next); try { localStorage.setItem(KEY, next); } catch (e) {} });
    if (home && /github\.io$|^localhost$|^127\./.test(location.hostname)) home.hidden = false;
  })();
  </script>
  <div class="layout" id="layout">
    <aside class="rail" id="rail" aria-label="Controls">
      <div class="grp"><span class="lab">Show</span>
        <label class="chk"><input type="checkbox" id="showBin" checked> Binary records</label>
        <label class="chk"><input type="checkbox" id="showCsat" checked> csat records</label>
      </div>
      <div class="grp"><label for="fNA">Nucleic acid</label>
        <select id="fNA"><option value="any">Any</option><option value="none">None</option><option value="RNA">RNA</option><option value="DNA">DNA</option></select></div>
      <div class="grp"><label for="fTS">Temperature</label>
        <select id="fTS"><option value="any">Any</option><option value="measured">Measured</option><option value="room temp. only">Room temperature only</option><option value="missing">Missing</option></select>
        <div class="range"><input id="tMin" type="number" step="1" placeholder="min °C" aria-label="Minimum temperature"><span>–</span><input id="tMax" type="number" step="1" placeholder="max °C" aria-label="Maximum temperature"></div></div>
      <div class="grp"><label for="fCsat">csat link</label>
        <select id="fCsat"><option value="any">Any</option><option value="csat record">csat record</option><option value="binary, identical sequence to a csat protein">Binary, identical sequence</option><option value="binary, same UniProt as a csat protein">Binary, same UniProt</option><option value="no csat">No csat</option></select></div>
      <div class="grp"><label for="fText">Find protein, paper or record</label><input id="fText" type="search" placeholder="FUS, P35637, pmid:29064502"></div>
      <div class="grp"><label for="psize">Point size</label><input id="psize" type="range" min="1" max="6" step="0.5" value="3.5"></div>
      <button id="reset" type="button">Reset view and filters</button>
      <p class="hint">Scroll to zoom, drag to pan, click a point to pin it.</p>
    </aside>
    <aside class="try" id="tryPane" hidden aria-label="Try your own experiment"></aside>
    <main class="stage">
      <div class="toolbar">
        <div class="grp"><label for="lens">Map</label><select id="lens"></select></div>
        <div class="grp"><label for="colorby">Color by</label><select id="colorby"></select></div>
        <div class="grp"><label for="mapstyle">Style</label><select id="mapstyle"><option value="solid">Solid blobs</option><option value="glow">Soft glow</option><option value="dots">Dots only</option></select></div>
        <div class="grp"><label for="hl">Highlight tool entries</label><select id="hl"></select></div>
        <div class="grp"><label for="outline">Outline</label><select id="outline"><option value="none">None</option><option value="light" selected>Light edge</option><option value="colored">Colored edge</option><option value="dashed">Dashed edge</option><option value="rings">Contour rings</option><option value="silhouette">Whole-map outline</option><option value="halo">Soft halo</option></select></div>
      </div>
      <div class="canvas-wrap" id="wrap">
        <canvas id="cv" aria-label="Scatter plot of records"></canvas>
        <div class="zoom"><button id="zin" type="button" aria-label="Zoom in">+</button><button id="zout" type="button" aria-label="Zoom out">−</button><button id="zfit" type="button">Fit</button></div>
        <div class="count" id="count"></div>
      </div>
      <div class="hlnote" id="hlnote" hidden></div>
      <div class="glyphkey" id="glyphkey" hidden><span><i class="g-fill"></i> protein with conditions (a record)</span><span><i class="g-ring"></i> protein without conditions (tool entry only)</span></div>
      <section class="legend" id="legend" aria-label="Legend"></section>
    </main>
    <section class="card" id="card" aria-live="polite"></section>
  </div>
</div>

    if (!UV || S.lens !== "umap_universe") return;
    projectU();
    const r = Math.max(1.2 * dpr, base * 0.62);
    ctx.beginPath();
    for (let j = 0; j < UV.n; j++) { const x = UV.sx[j], y = UV.sy[j]; if (x < -4 || y < -4 || x > W + 4 || y > H + 4) continue; ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, TAU); }
    ctx.lineWidth = 0.7 * dpr; ctx.strokeStyle = css("--neutral2"); ctx.globalAlpha = S.hl ? 0.22 : 0.45; ctx.stroke(); ctx.globalAlpha = 1;
  }
  function nearestU(px, py) {
    if (!UV || S.lens !== "umap_universe") return -1;
    let best = -1, bd = (11 * dpr) * (11 * dpr);
    for (let j = 0; j < UV.n; j++) { const dx = UV.sx[j] - px, dy = UV.sy[j] - py, d = dx * dx + dy * dy; if (d < bd) { bd = d; best = j; } }
    return best;
  }
  function buildUniCard(k) {
    const card = $("card"); card.textContent = "";
    card.appendChild(el("h2", null, S.pinU >= 0 ? "Pinned protein (no conditions)" : "Protein under cursor (no conditions)"));
    card.appendChild(el("h3", null, (UV.name[k] || UV.acc[k]) + " · " + UV.acc[k]));
    const tags = el("div"); tags.style.margin = "8px 0 0"; tags.append(el("span", "tag", "protein only"), el("span", "badge", "no conditions")); if (UV.gene[k]) tags.appendChild(el("span", "tag", UV.gene[k])); card.appendChild(tags);
    const dl = el("dl", "kv"); kv(dl, "Length", UV.len[k] + " aa"); if (UV.org[k]) kv(dl, "Organism", UV.org[k]);
    const names = []; D.tools.list.forEach((tl, ti) => { if (tl.kind === "prot" && UV.has(k, ti)) names.push(tl.label); });
    kv(dl, "In", names.length ? names.slice(0, 6).join(" · ") + (names.length > 6 ? " · +" + (names.length - 6) : "") : "");
    if (UV.obs[k]) kv(dl, "Entry", "No longer in UniProtKB; sequence taken from UniParc");
    const ns = D.space.seqsMeta.seqs[UV.nn[k]];
    if (ns) { const nn_ = (ns.name && ns.name !== "unnamed") ? ns.name : (ns.uniprot || "unnamed"); kv(dl, "Closest protein with records", (nn_.length > 70 ? nn_.slice(0, 69).trimEnd() + "…" : nn_) + " · cosine " + (UV.nncos[k] / 100).toFixed(2)); }
    card.appendChild(dl);
    const acts = el("div", "acts"); const mk = (tx, f, pr) => { const b = el("button", pr ? "primary" : null, tx); b.type = "button"; b.addEventListener("click", f); acts.appendChild(b); };
    mk("Use in Try your own experiment", () => { S.pinU = -1; setMode("try"); if (tryApi) tryApi.loadUniverse(k); }, true);
    if (S.pinU >= 0) mk("Unpin", () => { S.pinU = -1; refreshLight(); });
    card.appendChild(acts);
  }

  // ---------- Try your own experiment: star, rings, mode switch ----------
  const LENS_DIST = { tsne_full: "full", umap_full: "full", umap_prot: "prot", umap_cond: "cond", umap_fullM: "fullM", umap_universe: "prot" };
  function tryGeom() {
    const R = S.tryRes; if (!R) return null;
    const dl = LENS_DIST[S.lens] || "full", dist = R.dist[dl], e = D.emb[S.lens], nn = R.nn[dl];
    const E = tryApi && tryApi.state.entry;
    if (E && E.u >= 0 && UV && S.lens === "umap_universe") return { x: UV.xy[2 * E.u] / 65535, y: UV.xy[2 * E.u + 1] / 65535, nn, spread: 0, own: true };   // 它自己的位置
    let sw = 0, x = 0, y = 0;
    for (const j of nn.slice(0, 8)) { if (e[0][j] < 0) continue; const w = 1 / (dist[j] + 0.02); sw += w; x += w * e[0][j]; y += w * e[1][j]; }
    if (!sw) return null;
    x /= sw; y /= sw;
    let v = 0, c = 0; for (const j of nn) { if (e[0][j] < 0) continue; v += (e[0][j] - x) * (e[0][j] - x) + (e[1][j] - y) * (e[1][j] - y); c++; }
    return { x, y, nn, spread: Math.sqrt(v / Math.max(c, 1)) };
  }
  function drawStar(cx, cy, R) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? R * 0.45 : R; ctx.lineTo(cx + r * Math.cos(a), cy + r * Math.sin(a)); }
    ctx.closePath(); ctx.lineJoin = "round";
    ctx.lineWidth = 4.5 * dpr; ctx.strokeStyle = css("--canvas"); ctx.stroke();
    ctx.fillStyle = "#E4007C"; ctx.fill(); ctx.lineWidth = 1.2 * dpr; ctx.strokeStyle = css("--ink"); ctx.stroke();
  }
  function drawTry(g, base) {
    const pad = 16 * dpr, w = W - 2 * pad, h = H - 2 * pad, px = (pad + g.x * w) * S.k + S.tx, py = (pad + g.y * h) * S.k + S.ty;
    ctx.strokeStyle = css("--ink"); ctx.lineWidth = dpr; ctx.globalAlpha = 0.25; ctx.beginPath();
    for (const j of g.nn) { if (!vis[j]) continue; ctx.moveTo(px, py); ctx.lineTo(sx[j], sy[j]); }
    ctx.stroke(); ctx.lineWidth = 1.5 * dpr;
    g.nn.forEach((j, r) => { if (!vis[j]) return; ctx.globalAlpha = r < 3 ? 0.95 : 0.6; ctx.beginPath(); ctx.arc(sx[j], sy[j], base * 2.1 + (r < 3 ? 2.5 : 1) * dpr, 0, TAU); ctx.stroke(); });
    ctx.globalAlpha = 1; drawStar(px, py, 11 * dpr);
  }
  let tryApi = null;
  function b64ToBuf(b) { const bin = atob(b), n = bin.length, u = new Uint8Array(n); for (let i = 0; i < n; i++) u[i] = bin.charCodeAt(i); return u.buffer; }
  function showRecord(j) { S.pin = j; S.hover = j; S.pinU = -1; buildCard(); render(); }
  function setTryResult(res) { S.tryRes = res; render(); }
  function ensureTry() {
    if (tryApi) return tryApi;
    const X = D.space;
    const SP = new RecordsSpace.Space({ params: X.params, recordsMeta: X.recordsMeta, recordsBuf: b64ToBuf(X.recordsB64), seqsMeta: X.seqsMeta, seqsBuf: b64ToBuf(X.seqsB64), approx: X.approx, coverage: X.coverage });
    tryApi = initTryPanel({ D, I, SP, CP: CondParser, $, el, showRecord, fmt, setTryResult, setHighlight, UV });
    tryApi.setTool(S.hl);
    return tryApi;
  }
  function setMode(m) {
    S.mode = m;
    $("layout").classList.toggle("try-mode", m === "try");
    $("rail").hidden = m === "try"; $("tryPane").hidden = m !== "try";
    $("modeExplore").classList.toggle("on", m === "explore"); $("modeTry").classList.toggle("on", m === "try");
    $("modeExplore").setAttribute("aria-pressed", String(m === "explore")); $("modeTry").setAttribute("aria-pressed", String(m === "try"));
    if (m === "try") { resetAll(); ensureTry(); }
    resize(); refresh();
  }

  function init() {
    const lens = $("lens"); Object.keys(D.emb).forEach(k => { const o = el("option", null, D.emb_labels[k]); o.value = k; lens.appendChild(o); });
    lens.value = S.lens;
    const cb = $("colorby");
    GROUPS.forEach(([g, items]) => { const og = document.createElement("optgroup"); og.label = g; items.forEach(([kind, key]) => { const o = el("option", null, nameOf(kind, key)); o.value = kind + ":" + key; og.appendChild(o); }); cb.appendChild(og); });
    cb.value = "cat:protein";
    const m = D.meta;
    $("sub").textContent = m.n.toLocaleString("en-US") + " experiments from " + m.n_papers + " papers and datasets · " + m.n_binary.toLocaleString("en-US") + " binary + " + m.n_csat.toLocaleString("en-US") + " csat records";
    ["lens", "colorby", "mapstyle", "outline", "showBin", "showCsat", "fNA", "fTS", "fCsat", "tMin", "tMax", "fText", "psize"].forEach(id => { $(id).addEventListener(id === "fText" || id === "tMin" || id === "tMax" || id === "psize" ? "input" : "change", readControls); });
    $("reset").addEventListener("click", resetAll);
    $("modeExplore").addEventListener("click", () => setMode("explore"));
    $("modeTry").addEventListener("click", () => setMode("try"));
    if (D.tools) { populateHL(); $("hl").addEventListener("change", () => setHighlight($("hl").value)); } else $("hl").parentElement.hidden = true;
    $("zin").addEventListener("click", () => zoomAt(W / 2, H / 2, 1.4));
    $("zout").addEventListener("click", () => zoomAt(W / 2, H / 2, 1 / 1.4));
    $("zfit").addEventListener("click", fit);
    resize(); refresh();
    applyHash(); window.addEventListener("hashchange", applyHash);
    new ResizeObserver(() => { resize(); render(); }).observe($("wrap"));
    matchMedia("(prefers-color-scheme: dark)").addEventListener("change", refresh);
    new MutationObserver(refresh).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  }

  // ---------- pointer: hover, pin, pan, zoom ----------
  function zoomAt(cx, cy, f) {
    const k2 = clamp(S.k * f, 1, 60), r = k2 / S.k;
    S.tx = cx - (cx - S.tx) * r; S.ty = cy - (cy - S.ty) * r; S.k = k2; render();
  }
  function nearest(px, py) {
    let best = -1, bd = (14 * dpr) * (14 * dpr);
    for (let i = 0; i < N; i++) { if (!vis[i]) continue; const dx = sx[i] - px, dy = sy[i] - py, d = dx * dx + dy * dy; if (d < bd) { bd = d; best = i; } }
    return best;
  }
  const ptrs = new Map(); let drag = null, pinch = null;
  const pos = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * dpr, (e.clientY - r.top) * dpr]; };
  cv.addEventListener("pointerdown", e => {
    cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, pos(e));
    if (ptrs.size === 1) drag = { x: pos(e)[0], y: pos(e)[1], tx: S.tx, ty: S.ty, moved: 0 };
    if (ptrs.size === 2) { const [a, b] = Array.from(ptrs.values()); pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]) }; drag = null; }
  });
  cv.addEventListener("pointermove", e => {
    const p = pos(e);
    if (ptrs.has(e.pointerId)) ptrs.set(e.pointerId, p);
    if (pinch && ptrs.size === 2) {
      const [a, b] = Array.from(ptrs.values()), d = Math.hypot(a[0] - b[0], a[1] - b[1]);
      zoomAt((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, d / pinch.d); pinch.d = d; return;
    }
    if (drag && e.buttons) {
      const dx = p[0] - drag.x, dy = p[1] - drag.y; drag.moved = Math.max(drag.moved, Math.hypot(dx, dy));
      if (drag.moved > 4 * dpr) { S.tx = drag.tx + dx; S.ty = drag.ty + dy; render(); }
      return;
    }
    const j = nearest(p[0], p[1]), ju = j < 0 ? nearestU(p[0], p[1]) : -1;
    if (j !== S.hover || ju !== S.hoverU) { S.hover = j; S.hoverU = ju; if (S.pin < 0 && S.pinU < 0 && S.mode !== "try") buildCard(); render(); }
  });
  const up = e => {
    if (drag && drag.moved <= 4 * dpr && ptrs.size === 1) {
      const p = pos(e), j = nearest(p[0], p[1]); S.pin = j; S.hover = j; S.pinU = j < 0 ? nearestU(p[0], p[1]) : -1; buildCard(); render();
    }
    ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null; if (ptrs.size === 0) drag = null;
  };
  cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
  cv.addEventListener("pointerleave", () => { if (S.hover >= 0 && !ptrs.size) { S.hover = -1; if (S.pin < 0) buildCard(); render(); } });
  cv.addEventListener("wheel", e => { e.preventDefault(); const p = pos(e); zoomAt(p[0], p[1], e.deltaY < 0 ? 1.18 : 1 / 1.18); }, { passive: false });
  cv.addEventListener("dblclick", fit);
  document.addEventListener("keydown", e => { if (e.key === "Escape" && (S.pin >= 0 || S.pinU >= 0)) { S.pin = -1; S.pinU = -1; refreshLight(); } });
  init();
})();
</script>
